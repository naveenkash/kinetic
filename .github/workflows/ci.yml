# Runs on every push and pull request: the engine-free KineticCore checks; the browser
# client's simulation tests, type check, WebAssembly build, smoke test and production build;
# and the backend's format, lint, type, unit and database tests. The full-loop integration test needs the edge
# functions and generated keys running, so it stays a local test (backend/README.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: KineticCore
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Bible tables, tests, sanitizers, bench and the sample match report
        run: make -C game all-checks

  web:
    name: Browser client
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Simulation tests
        run: make -C web test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Client type check
        working-directory: web/client
        run: |
          npm ci
          npm run typecheck
      - name: Install Emscripten
        run: brew install emscripten
      - name: WebAssembly build and smoke test
        run: |
          make -C web wasm
          cd web/client && node smoke.mjs && npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.1
      - name: Format
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Types
        run: deno task check
      - name: Unit tests
        run: deno task test:unit
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Start the local stack
        run: supabase start
      - name: Database tests
        run: supabase test db
      - name: Load the rulesets and catalog
        run: deno task content
      - name: Worker database tests
        run: deno task test:worker-db
      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup
